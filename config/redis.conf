# ============================================================================
# ARCHIVO DE CONFIGURACIÓN DE REDIS (redis.conf)
# Proyecto Parcial: Caso Megashop - Bases de Datos No Relacionales
# Optimizado para Uso Eficiente de Memoria RAM y Expiración (Criterio Sobresaliente)
# ============================================================================

bind 127.0.0.1 0.0.0.0
protected-mode no
port 6379
timeout 0
tcp-keepalive 300

# Gestión eficiente de memoria RAM
maxmemory 256mb
# Política de desalojo: elimina las claves menos usadas recientemente (LRU) cuando se llena la RAM
maxmemory-policy allkeys-lru

# Persistencia AOF ligera para recuperación ante reinicios
appendonly yes
appendfsync everysec

# Optimización de memoria para estructuras Hash pequeñas (pedido:tracking y cliente:critico)
hash-max-listpack-entries 512
hash-max-listpack-value 64
