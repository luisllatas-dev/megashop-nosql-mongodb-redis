# ============================================================================
# ARCHIVO DE CONFIGURACIÓN DE MONGODB (mongod.conf)
# Proyecto Parcial: Caso Megashop - Bases de Datos No Relacionales
# ============================================================================

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1.0
    collectionConfig:
      blockCompressor: snappy

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 127.0.0.1,0.0.0.0

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
